<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StatToolbox Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .glass { background: rgba(255, 255, 255, 0.7); backdrop-filter: blur(10px); }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen flex flex-col">

    <nav class="bg-white/80 backdrop-blur-md sticky top-0 z-50 border-b border-slate-200">
        <div class="max-w-7xl mx-auto px-6 h-16 flex items-center justify-between">
            <div class="flex items-center gap-2">
                <div class="w-8 h-8 bg-indigo-600 rounded-lg flex items-center justify-center text-white font-bold">S</div>
                <span class="text-xl font-extrabold tracking-tight">Stat<span class="text-indigo-600">Toolbox</span></span>
            </div>
            <div class="flex gap-1 bg-slate-100 p-1 rounded-xl">
                <button onclick="showView('linear')" id="btn-linear" class="nav-btn px-4 py-2 rounded-lg text-sm font-semibold transition-all active-btn bg-white shadow-sm text-indigo-600">Prog. Lineal</button>
                <button onclick="showView('stats')" id="btn-stats" class="nav-btn px-4 py-2 rounded-lg text-sm font-semibold text-slate-600 hover:text-slate-900 transition-all">Estadística</button>
            </div>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto w-full p-6 flex-grow">
        
        <div id="view-linear" class="view active flex flex-col lg:flex-row gap-6">
            <div class="lg:w-1/3 flex flex-col gap-4">
                <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
                    <h2 class="text-lg font-bold mb-1">Restricciones</h2>
                    <p class="text-slate-500 text-sm mb-4">Define tus inecuaciones ($ax + by \le c$)</p>
                    <button onclick="addConstraint()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-2.5 rounded-xl transition-all shadow-md shadow-indigo-100 flex items-center justify-center gap-2 mb-4">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                            <path fill-rule="evenodd" d="M10 3a1 1 0 011 1v5h5a1 1 0 110 2h-5v5a1 1 0 11-2 0v-5H4a1 1 0 110-2h5V4a1 1 0 011-1z" clip-rule="evenodd" />
                        </svg>
                        Añadir restricción
                    </button>
                    <div id="constraints-list" class="space-y-3"></div>
                </div>
            </div>

            <div class="lg:w-2/3 bg-white p-6 rounded-2xl shadow-sm border border-slate-200 min-h-[500px]">
                <div class="flex items-center justify-between mb-6">
                    <h2 class="text-lg font-bold">Visualización Geométrica</h2>
                    <span class="text-xs font-bold px-2 py-1 bg-indigo-50 text-indigo-600 rounded-full uppercase tracking-wider">Región Factible</span>
                </div>
                <canvas id="lpChart"></canvas>
            </div>
        </div>

        <div id="view-stats" class="view hidden">
            <div class="w-full bg-white p-8 rounded-3xl shadow-sm border border-slate-200">
                <div class="max-w-2xl mx-auto text-center">
                    <h2 class="text-3xl font-extrabold mb-2">Análisis de Datos</h2>
                    <p class="text-slate-500 mb-8">Calcula automáticamente los estadísticos descriptivos de tu muestra.</p>
                    
                    <div class="flex flex-col sm:flex-row gap-3 mb-10">
                        <input type="text" id="stats-data" placeholder="Ej: 10, 25, 14, 30, 22..." class="flex-grow px-5 py-3 rounded-2xl border border-slate-200 focus:ring-4 focus:ring-indigo-100 focus:border-indigo-500 outline-none transition-all text-lg">
                        <button onclick="processStats()" class="bg-slate-900 hover:bg-black text-white px-8 py-3 rounded-2xl font-bold transition-all shadow-lg">Analizar</button>
                    </div>

                    <div id="stats-output" class="hidden grid grid-cols-2 md:grid-cols-4 gap-4">
                        <div class="p-4 rounded-2xl bg-indigo-50 border border-indigo-100">
                            <span class="text-[10px] uppercase font-bold text-indigo-400 block mb-1 tracking-widest">Media</span>
                            <strong id="res-media" class="text-2xl text-indigo-700">-</strong>
                        </div>
                        <div class="p-4 rounded-2xl bg-slate-50 border border-slate-100">
                            <span class="text-[10px] uppercase font-bold text-slate-400 block mb-1 tracking-widest">Mediana</span>
                            <strong id="res-mediana" class="text-2xl text-slate-700">-</strong>
                        </div>
                        <div class="p-4 rounded-2xl bg-slate-50 border border-slate-100">
                            <span class="text-[10px] uppercase font-bold text-slate-400 block mb-1 tracking-widest">D. Estándar</span>
                            <strong id="res-desv" class="text-2xl text-slate-700">-</strong>
                        </div>
                        <div class="p-4 rounded-2xl bg-slate-50 border border-slate-100">
                            <span class="text-[10px] uppercase font-bold text-slate-400 block mb-1 tracking-widest">Varianza</span>
                            <strong id="res-var" class="text-2xl text-slate-700">-</strong>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script>
        // Lógica de cambio de vista
        function showView(name) {
            document.querySelectorAll('.view').forEach(v => v.classList.add('hidden'));
            document.getElementById('view-' + name).classList.remove('hidden');
            document.getElementById('view-' + name).classList.add('flex');
            
            document.querySelectorAll('.nav-btn').forEach(b => {
                b.classList.remove('bg-white', 'shadow-sm', 'text-indigo-600');
                b.classList.add('text-slate-600');
            });
            document.getElementById('btn-' + name).classList.add('bg-white', 'shadow-sm', 'text-indigo-600');
            document.getElementById('btn-' + name).classList.remove('text-slate-600');
        }

        // --- EL RESTO DE TU LÓGICA DE PROGRAMACIÓN LINEAL Y ESTADÍSTICA SE MANTIENE IGUAL ---
        let constraints = [{ a: 1, b: 2, c: 10, id: 1 }, { a: 3, b: 1, c: 15, id: 2 }];
        let lpChart;

        function addConstraint() {
            constraints.push({ a: 1, b: 1, c: 5, id: Date.now() });
            renderLP();
        }

        function updateConstraint(id, key, val) {
            const c = constraints.find(item => item.id === id);
            c[key] = parseFloat(val) || 0;
            updateLPChart();
        }

        function renderLP() {
            const container = document.getElementById('constraints-list');
            container.innerHTML = '';
            constraints.forEach(c => {
                const div = document.createElement('div');
                div.className = 'bg-slate-50 p-4 rounded-xl border border-slate-100 flex items-center gap-2 group';
                div.innerHTML = `
                    <input type="number" value="${c.a}" oninput="updateConstraint(${c.id}, 'a', this.value)" class="w-12 bg-white border border-slate-200 rounded p-1 text-center font-bold text-indigo-600">
                    <span class="text-slate-400 font-medium text-xs">x +</span>
                    <input type="number" value="${c.b}" oninput="updateConstraint(${c.id}, 'b', this.value)" class="w-12 bg-white border border-slate-200 rounded p-1 text-center font-bold text-indigo-600">
                    <span class="text-slate-400 font-medium text-xs">y ≤</span>
                    <input type="number" value="${c.c}" oninput="updateConstraint(${c.id}, 'c', this.value)" class="w-16 bg-white border border-slate-200 rounded p-1 text-center font-bold text-slate-700">
                `;
                container.appendChild(div);
            });
            updateLPChart();
        }

        function updateLPChart() {
            const ctx = document.getElementById('lpChart').getContext('2d');
            const xValues = Array.from({length: 21}, (_, i) => i);
            const datasets = constraints.map((c, i) => ({
                label: `R${i+1}`,
                data: xValues.map(x => c.b !== 0 ? (c.c - c.a * x) / c.b : null),
                borderColor: `rgba(79, 70, 229, ${1 - i*0.2})`,
                borderWidth: 3,
                fill: false,
                tension: 0.1,
                pointRadius: 0
            }));

            const feasibleArea = xValues.map(x => {
                let minY = 20;
                constraints.forEach(c => { if(c.b !== 0) minY = Math.min(minY, (c.c - c.a * x) / c.b); });
                return Math.max(0, minY);
            });

            datasets.push({
                label: 'Región Factible',
                data: feasibleArea,
                backgroundColor: 'rgba(79, 70, 229, 0.15)',
                fill: true,
                pointRadius: 0,
                borderWidth: 0
            });

            if (lpChart) lpChart.destroy();
            lpChart = new Chart(ctx, {
                type: 'line',
                data: { labels: xValues, datasets },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: { 
                        y: { min: 0, max: 20, grid: { color: '#f1f5f9' } },
                        x: { min: 0, max: 20, grid: { color: '#f1f5f9' } }
                    },
                    plugins: { legend: { display: false } },
                    animation: { duration: 400 }
                }
            });
        }

        function processStats() {
            const input = document.getElementById('stats-data').value;
            const data = input.split(',').map(n => parseFloat(n.trim())).filter(n => !isNaN(n));
            if (data.length === 0) return;
            const n = data.length;
            const media = data.reduce((a, b) => a + b, 0) / n;
            const sorted = [...data].sort((a, b) => a - b);
            const mediana = n % 2 === 0 ? (sorted[n/2 - 1] + sorted[n/2]) / 2 : sorted[Math.floor(n/2)];
            const varianza = data.reduce((a, b) => a + Math.pow(b - media, 2), 0) / n;
            document.getElementById('res-media').innerText = media.toFixed(1);
            document.getElementById('res-mediana').innerText = mediana.toFixed(1);
            document.getElementById('res-var').innerText = varianza.toFixed(1);
            document.getElementById('res-desv').innerText = Math.sqrt(varianza).toFixed(1);
            document.getElementById('stats-output').classList.remove('hidden');
            document.getElementById('stats-output').classList.add('grid');
        }

        renderLP();
    </script>
</body>
</html>
